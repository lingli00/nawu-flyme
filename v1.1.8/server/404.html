<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · 这条路走到头了 — 纳物</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --surface:#ffffff; --surface-2:#fafbfa; --ink:#18201c; --ink-2:#4d5751; --ink-3:#6b7370;
    --line:#e4e7e3; --line-2:#eef0ed; --accent:#3f7d67; --accent-2:#346a57;
    --seal-bg:#ffffff; --seal-border:#e4e7e3; --seal-ink:#3f7d67;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface:#1a1f1d; --surface-2:#202623; --ink:#e9ecea; --ink-2:#b2bab5; --ink-3:#8a938d;
      --line:#2b312e; --line-2:#232925; --accent:#63a68c; --accent-2:#7bb99f;
      --seal-bg:#1a1f1d; --seal-border:#2b312e; --seal-ink:#63a68c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;background:var(--surface-2);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    background-image:
      linear-gradient(var(--line-2) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-2) 1px, transparent 1px);
    background-size:26px 26px;
    background-position:-1px -1px;
  }
  .wrap{width:100%;max-width:23.5rem;text-align:center}
  .seal{
    width:72px;height:72px;margin:0 auto 20px;border-radius:17px;
    background:var(--seal-bg);border:1px solid var(--seal-border);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(24,32,28,.04), 0 8px 24px -14px rgba(24,32,28,.22);
  }
  .seal svg{width:44px;height:44px;display:block}
  .code{
    margin:0;font-family:"Songti SC","SimSun",serif;font-weight:700;
    font-size:56px;line-height:1;letter-spacing:-.02em;color:var(--ink-3);opacity:.55;
  }
  h1{margin:12px 0 0;font-size:17px;font-weight:600;letter-spacing:.01em}
  p{margin:8px auto 0;max-width:19rem;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
  .pathbox{margin-top:14px}
  .path{
    max-width:100%;padding:6px 11px;border-radius:8px;
    background:var(--surface);border:1px solid var(--line);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
    color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:24px auto 0;height:46px;width:100%;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;
    text-decoration:none;cursor:pointer;transition:background .16s ease, transform .16s ease;
  }
  .btn:hover{background:var(--accent-2)}
  .btn:active{transform:scale(.985)}
  .hint{margin-top:14px;font-size:11.5px;color:var(--ink-3)}
  .hint a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  .hint a:hover{border-bottom-color:currentColor}
</style>
</head>
<body>
  <main class="wrap">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <text x="24" y="35.5" text-anchor="middle" fill="var(--seal-ink)"
              font-family="Songti SC,SimSun,serif" font-size="33" font-weight="700">纳</text>
      </svg>
    </div>

    <p class="code">404</p>
    <h1>这条路走到头了</h1>
    <p>你要找的页面不在这里 —— 也许是链接记错了，也许它已经搬走了。</p>

    <div class="pathbox"><code class="path" id="p">/</code></div>

    <a class="btn" href="/">回到首页</a>
    <div class="hint">想记一笔？<a href="/#/ledger">直接去生活流</a></div>
  </main>
  <script>
    (function () {
      var el = document.getElementById('p');
      var raw = location.pathname + (location.hash || '');
      try { raw = decodeURI(raw); } catch (e) {}
      if (raw.length > 64) { raw = raw.slice(0, 61) + '…'; }
      el.textContent = raw || '/';
      el.title = location.pathname || '/';
    })();
  </script>
</body>
</html>
