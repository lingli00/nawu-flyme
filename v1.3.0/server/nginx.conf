# ============================================================================
#  纳物 Guifou · Nginx / 宝塔 站点配置参考
#  适用：Nginx 1.21 + PHP 7.2 ~ 8.0 + MySQL 5.5
#
#  使用方法（宝塔面板）：
#    1. 网站 → 设置 → 配置文件：把下面【server 块内的 location 规则】按注释合并进去
#       （宝塔已经自动生成了 listen / root / include enable-php-xx.conf，不要整段替换）
#    2. 网站 → 设置 → 网站目录：运行目录设为 /（根目录），并勾选「防跨站攻击(open_basedir)」
#    3. 网站 → 设置 → 伪静态：贴入本文件末尾「伪静态规则」那一小段也能达到同样效果
#    4. 重启 Nginx（重载配置）
#
#  如果你的宝塔版本支持「配置文件」整段覆盖，也可以以本文件为模板改。
# ============================================================================

server {
    listen 80;
    listen 443 ssl http2;   # 未启用 HTTPS 时删掉这一行
    server_name your.domain.com;
    root  /www/wwwroot/guifou;
    index index.php index.html;

    # PHP 最大请求体的限制（云备份 payload 可能较大，建议 ≥ 20M）
    client_max_body_size 32m;

    access_log /www/wwwlogs/guifou.log;
    error_log  /www/wwwlogs/guifou.error.log;

    charset utf-8;

    # ------------------------------------------------------------------
    # 1) 安全：禁止访问内部目录与配置文件
    # ------------------------------------------------------------------
    location ^~ /app/       { deny all; return 404; }
    location ^~ /storage/   { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }
    location ~* \.(md|sql|log|example)$ { deny all; return 404; }

    # ------------------------------------------------------------------
    # 2) 静态资源：直接交给 Nginx，带长缓存
    # ------------------------------------------------------------------
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 3) 主路由：先找真实文件，找不到才交给 index.php
    #    —— 前端用的是 HashRouter（/#/admin），所以只有 /api/* 真正需要 PHP
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # 4) PHP（宝塔默认已包含 enable-php-xx.conf，二选一即可）
    #    注意 PHP 版本：7.2 / 7.3 / 7.4 / 8.0 都可以；低于 7.2 不行。
    # ------------------------------------------------------------------
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass   unix:/tmp/php-cgi-74.sock;   # 改成你实际的 PHP 版本 socket，如 php-cgi-72.sock
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }
}

# ============================================================================
#  纯伪静态（宝塔「伪静态」标签页）备用写法
#  只有在你没有改站点配置文件、只想加 try_files 时才需要
# ============================================================================
